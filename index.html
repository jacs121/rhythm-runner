<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rhythm Runner</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            touch-action: none;
            overscroll-behavior: contain;
            position: fixed;
            -webkit-overflow-scrolling: touch;
        }

        #gameCanvas {
            display: block;
            background: #0a0a1a;
            touch-action: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            -webkit-transform: translateZ(0);
        }

        .mobile-controls {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            pointer-events: none;
            gap: 15px;
            max-width: 100vw;
            box-sizing: border-box;
            padding: 0 10px;
        }

        .movement-controls {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 70px);
            gap: 10px;
            float: left;
            pointer-events: auto;
        }

        .action-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            float: right;
            pointer-events: auto;
        }

        .mobile-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(0, 255, 255, 0.6);
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            touch-action: manipulation;
            transition: all 0.1s ease;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .mobile-btn.pressed {
            background: rgba(0, 255, 255, 0.3);
            border-color: #00ffff;
            transform: scale(0.95);
            box-shadow: 0 4px 8px rgba(0, 255, 255, 0.3);
        }

        .mobile-btn.action {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            font-size: 16px;
            border-width: 3px;
        }

        .mobile-btn.dash {
            background: rgba(255, 200, 50, 0.2);
            border-color: rgba(255, 200, 50, 0.8);
        }

        .mobile-btn.dash.pressed {
            background: rgba(255, 200, 50, 0.4);
            border-color: #ffc800;
        }

        .mobile-btn.pause {
            background: rgba(255, 100, 100, 0.2);
            border-color: rgba(255, 100, 100, 0.8);
        }

        .mobile-btn.pause.pressed {
            background: rgba(255, 100, 100, 0.4);
            border-color: #ff6464;
        }

        @media (max-width: 1024px) and (hover: none) and (pointer: coarse) {
            .mobile-controls {
                display: block;
            }
            .portrait-notice {
                display: none;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 0, 0, 0.9);
                color: #00ffff;
                padding: 20px;
                border-radius: 10px;
                border: 2px solid #00ffff;
                text-align: center;
                z-index: 10000;
                font-size: 18px;
                font-weight: bold;
            }
            @media (orientation: portrait) {
                .gameplay .portrait-notice {
                    display: block;
                }
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div class="mobile-controls">
        <div class="portrait-notice">
            Please rotate your device to landscape for the best gameplay experience!
        </div>
        
        <div class="movement-controls">
            <div></div>
            <button class="mobile-btn" id="upBtn" style="grid-column: 2; grid-row: 1;">&uarr;</button>
            <div></div>
            
            <button class="mobile-btn" id="leftBtn" style="grid-column: 1; grid-row: 2;">&larr;</button>
            <div></div>
            <button class="mobile-btn" id="rightBtn" style="grid-column: 3; grid-row: 2;">&rarr;</button>
            
            <div></div>
            <button class="mobile-btn" id="downBtn" style="grid-column: 2; grid-row: 3;">&darr;</button>
            <div></div>
        </div>

        <div class="action-controls">
            <button class="mobile-btn dash action" id="dashBtn">DASH</button>
            <button class="mobile-btn pause action" id="pauseBtn">&#10074;&#10074;</button>
        </div>
    </div>

    <script>
        class IndexedDBCache {
            constructor() {
                this.dbName = 'RhythmRunnerCacheDB';
                this.storeName = 'songs';
                this.db = null;
            }

            async init() {
                if (this.db) return this.db;
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(this.storeName)) {
                            db.createObjectStore(this.storeName, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve(this.db);
                    };
                    request.onerror = (e) => reject(e);
                });
            }

            async saveSong(id, title, fileBlob, obstacles) {
                await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(this.storeName, 'readwrite');
                    const store = tx.objectStore(this.storeName);
                    store.put({ id, title, fileBlob, obstacles });
                    tx.oncomplete = () => resolve();
                    tx.onerror = (e) => reject(e);
                });
            }

            async getSong(id) {
                await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(this.storeName, 'readonly');
                    const store = tx.objectStore(this.storeName);
                    const request = store.get(id);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = (e) => reject(e);
                });
            }

            async getAllSongs() {
                await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(this.storeName, 'readonly');
                    const store = tx.objectStore(this.storeName);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = (e) => reject(e);
                });
            }

            async removeSong(id) {
                await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(this.storeName, 'readwrite');
                    const store = tx.objectStore(this.storeName);
                    store.delete(id);
                    tx.oncomplete = () => resolve();
                    tx.onerror = (e) => reject(e);
                });
            }

            async clearAll() {
                await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(this.storeName, 'readwrite');
                    const store = tx.objectStore(this.storeName);
                    store.clear();
                    tx.oncomplete = () => resolve();
                    tx.onerror = (e) => reject(e);
                });
            }
        }

        class UniquePatternDetector {
            async analyzeAudio(audioBuffer, onProgress) {
                if (onProgress) onProgress('Filtering quiet volumes & analyzing peaks');
                await new Promise(r => setTimeout(r, 10));

                const sampleRate = audioBuffer.sampleRate;
                const channelData = audioBuffer.getChannelData(0);
                const totalSamples = channelData.length;

                let maxPeak = 0.001;
                for (let i = 0; i < totalSamples; i++) {
                    const abs = Math.abs(channelData[i]);
                    if (abs > maxPeak) maxPeak = abs;
                }
                const normalized = new Float32Array(totalSamples);
                for (let i = 0; i < totalSamples; i++) {
                    normalized[i] = channelData[i] / maxPeak;
                }

                const hopSize = 1024;
                const bassEnergy = [];     
                const midEnergy = [];      
                const trebleEnergy = [];   

                let totalEnergySum = 0;
                let frameCount = 0;

                for (let i = 0; i < totalSamples; i += hopSize) {
                    const end = Math.min(i + hopSize, totalSamples);
                    let lowSum = 0;
                    let midSum = 0;
                    let highSum = 0;

                    for (let j = i; j < end; j++) {
                        const val = normalized[j];
                        lowSum += val * val;
                        if (j > i) {
                            const delta = Math.abs(val - normalized[j - 1]);
                            midSum += delta;
                            if (j % 2 === 0) highSum += delta;
                        }
                    }

                    const len = end - i;
                    const bassVal = Math.sqrt(lowSum / len);
                    const midVal = midSum / len;
                    const highVal = highSum / len;

                    bassEnergy.push(bassVal);
                    midEnergy.push(midVal);
                    trebleEnergy.push(highVal);

                    totalEnergySum += bassVal + midVal + highVal;
                    frameCount++;
                }

                const averageVolumeThreshold = (totalEnergySum / (frameCount * 3)) * 1.35;

                const obstacles = [];
                const minGapMs = 150;
                let lastTimestamp = -1000;
                const directions = ['right-to-left', 'left-to-right', 'top-to-bottom', 'bottom-to-top'];

                const bassWin = 6;
                for (let i = bassWin; i < bassEnergy.length - bassWin; i++) {
                    if (bassEnergy[i] < averageVolumeThreshold) continue;

                    let localAvg = 0;
                    for (let w = -bassWin; w <= bassWin; w++) localAvg += bassEnergy[i + w];
                    localAvg /= (bassWin * 2 + 1);

                    if (bassEnergy[i] > localAvg * 1.25) {
                        const timeMs = (i * hopSize / sampleRate) * 1000;
                        if (timeMs - lastTimestamp >= minGapMs) {
                            const dir = directions[obstacles.length % directions.length];
                            obstacles.push({ time: timeMs, type: 'square', direction: dir, energy: bassEnergy[i] });
                            lastTimestamp = timeMs;
                        }
                    }
                }

                const midWin = 4;
                for (let i = midWin; i < midEnergy.length - midWin; i++) {
                    if (midEnergy[i] < averageVolumeThreshold * 0.8) continue;

                    let localAvg = 0;
                    for (let w = -midWin; w <= midWin; w++) localAvg += midEnergy[i + w];
                    localAvg /= (midWin * 2 + 1);

                    if (midEnergy[i] > localAvg * 1.1) {
                        const timeMs = (i * hopSize / sampleRate) * 1000;
                        if (timeMs - lastTimestamp >= 180) {
                            const dir = directions[obstacles.length % directions.length];
                            obstacles.push({ time: timeMs, type: 'triangle', direction: dir, energy: midEnergy[i] });
                            lastTimestamp = timeMs;
                        }
                    }
                }

                const trebleWin = 6;
                for (let i = trebleWin; i < trebleEnergy.length - trebleWin; i++) {
                    if (trebleEnergy[i] < averageVolumeThreshold * 0.7) continue;

                    let localAvg = 0;
                    for (let w = -trebleWin; w <= trebleWin; w++) localAvg += trebleEnergy[i + w];
                    localAvg /= (trebleWin * 2 + 1);

                    if (trebleEnergy[i] > localAvg * 1.35) {
                        const timeMs = (i * hopSize / sampleRate) * 1000;
                        if (timeMs - lastTimestamp >= 800) {
                            const dir = directions[obstacles.length % directions.length];
                            obstacles.push({ time: timeMs, type: 'laser', direction: dir, energy: trebleEnergy[i] });
                            lastTimestamp = timeMs;
                        }
                    }
                }

                obstacles.sort((a, b) => a.time - b.time);

                const totalDurationMs = audioBuffer.duration * 1000;
                if (obstacles.length < 20) {
                    for (let t = 1200; t < totalDurationMs - 1200; t += 700) {
                        const existing = obstacles.some(o => Math.abs(o.time - t) < 200);
                        if (!existing) {
                            const types = ['square', 'triangle', 'laser'];
                            const chosenType = types[Math.floor(t / 700) % types.length];
                            const dir = directions[obstacles.length % directions.length];
                            obstacles.push({ time: t, type: chosenType, direction: dir, energy: 0.5 });
                        }
                    }
                }

                obstacles.sort((a, b) => a.time - b.time);
                return obstacles;
            }
        }

        const DIFFICULTY_CONFIGS = {
            easy: {
                name: 'Easy',
                obstacleSpeedMultiplier: 0.75,
                spawnStep: 3,
                damageMultiplier: 0.5,
                warningDuration: 1800,
                playerSpeed: 6.5,
                scoreMultiplier: 0.7,
                baseHealth: 100,
                regenInterval: 3000,
                regenAmount: 3
            },
            medium: {
                name: 'Medium',
                obstacleSpeedMultiplier: 0.95,
                spawnStep: 2,
                damageMultiplier: 0.85,
                warningDuration: 1300,
                playerSpeed: 7.0,
                scoreMultiplier: 1.0,
                baseHealth: 100,
                regenInterval: 5000,
                regenAmount: 2
            },
            hard: {
                name: 'Hard',
                obstacleSpeedMultiplier: 1.2,
                spawnStep: 1,
                damageMultiplier: 1.2,
                warningDuration: 900,
                playerSpeed: 7.5,
                scoreMultiplier: 1.5,
                baseHealth: 100,
                regenInterval: 8000,
                regenAmount: 1
            },
            epic: {
                name: 'Epic Gamer',
                obstacleSpeedMultiplier: 1.45,
                spawnStep: 1,
                damageMultiplier: 1.5,
                warningDuration: 600,
                playerSpeed: 8.0,
                scoreMultiplier: 2.0,
                baseHealth: 100,
                regenInterval: 0,
                regenAmount: 0
            }
        };

        const GAME_MODES = {
            classic: { name: 'Classic', directions: ['right-to-left'] },
            sideToSide: { name: 'Side to Side', directions: ['right-to-left', 'left-to-right'] },
            topToBottom: { name: 'Top & Bottom', directions: ['top-to-bottom', 'bottom-to-top'] },
            omnidirectional: { name: '4-Direction', directions: ['right-to-left', 'left-to-right', 'top-to-bottom', 'bottom-to-top'] }
        };

        class UIRenderer {
            constructor(ctx, canvas) {
                this.ctx = ctx;
                this.canvas = canvas;
            }

            drawButton(x, y, width, height, text, highlighted = false, disabled = false) {
                this.ctx.save();
                if (disabled) {
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                } else if (highlighted) {
                    const gradient = this.ctx.createLinearGradient(x, y, x, y + height);
                    gradient.addColorStop(0, 'rgba(102, 126, 234, 0.95)');
                    gradient.addColorStop(1, 'rgba(118, 75, 162, 0.95)');
                    this.ctx.fillStyle = gradient;
                    this.ctx.shadowBlur = 22;
                    this.ctx.shadowColor = 'rgba(102, 126, 234, 0.7)';
                } else {
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
                }
                this.ctx.fillRect(x, y, width, height);
                this.ctx.strokeStyle = disabled ? 'rgba(255, 255, 255, 0.1)' : (highlighted ? '#00ffff' : 'rgba(255, 255, 255, 0.35)');
                this.ctx.lineWidth = 3;
                this.ctx.strokeRect(x, y, width, height);
                
                this.ctx.fillStyle = disabled ? 'rgba(255, 255, 255, 0.3)' : '#ffffff';
                const isMobile = window.innerWidth < 900;
                const textSize = isMobile ? Math.max(14, Math.floor(height * 0.32)) : Math.max(16, Math.floor(height * 0.38));
                this.ctx.font = 'bold ' + textSize + 'px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText(text, x + width / 2, y + height / 2);
                this.ctx.restore();
                return { x, y, width, height };
            }

            drawSlider(x, y, width, height, value, max, label) {
                this.ctx.save();
                const isMobile = window.innerWidth < 900;
                this.ctx.fillStyle = '#aaa';
                const labelSize = isMobile ? Math.floor(height * 0.6) : Math.floor(height * 0.75);
                this.ctx.font = 'bold ' + labelSize + 'px Arial';
                this.ctx.textAlign = 'left';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText(label, x, y + height / 2);
                
                const labelWidth = this.ctx.measureText(label).width;
                const sliderX = x + labelWidth + (isMobile ? 15 : 20);
                const sliderWidth = width - labelWidth - (isMobile ? 60 : 80);
                
                const trackHeight = isMobile ? 6 : 8;
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                this.ctx.fillRect(sliderX, y + height / 2 - trackHeight / 2, sliderWidth, trackHeight);
                
                const fillWidth = (value / max) * sliderWidth;
                const gradient = this.ctx.createLinearGradient(sliderX, y, sliderX + fillWidth, y);
                gradient.addColorStop(0, '#00ffff');
                gradient.addColorStop(1, '#667eea');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(sliderX, y + height / 2 - trackHeight / 2, fillWidth, trackHeight);
                
                const thumbX = sliderX + fillWidth;
                const thumbRadius = isMobile ? 9 : 11;
                this.ctx.fillStyle = '#00ffff';
                this.ctx.shadowBlur = isMobile ? 8 : 12;
                this.ctx.shadowColor = 'rgba(0, 255, 255, 0.6)';
                this.ctx.beginPath();
                this.ctx.arc(thumbX, y + height / 2, thumbRadius, 0, Math.PI * 2);
                this.ctx.fill();
                
                this.ctx.shadowBlur = 0;
                this.ctx.fillStyle = '#00ffff';
                const valueSize = isMobile ? Math.floor(height * 0.55) : Math.floor(height * 0.7);
                this.ctx.font = 'bold ' + valueSize + 'px Arial';
                this.ctx.textAlign = 'right';
                this.ctx.fillText(Math.round(value) + (label.includes('Volume') ? '%' : ''), x + width, y + height / 2);
                this.ctx.restore();
                
                const hitAreaHeight = isMobile ? 24 : 30;
                return { x: sliderX, y: y + height / 2 - hitAreaHeight / 2, width: sliderWidth, height: hitAreaHeight };
            }

            isPointInRect(px, py, rect) {
                return px >= rect.x && px <= rect.x + rect.width && py >= rect.y && py <= rect.y + rect.height;
            }
        }

        class RhythmRunner {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.ui = new UIRenderer(this.ctx, canvas);
                this.beatDetector = new UniquePatternDetector();
                this.idbCache = new IndexedDBCache();
                
                this.resizeCanvas();
                window.addEventListener('resize', () => {
                    this.resizeCanvas();
                    this.updateMobileControlsVisibility();
                });
                
                this.difficulty = 'medium';
                this.difficultyConfig = DIFFICULTY_CONFIGS.medium;
                this.gameMode = 'classic';

                var gameArea = this.getGameArea()
                
                this.player = {
                    x: gameArea.x + gameArea.width / 2,
                    y: gameArea.y + gameArea.height / 2,
                    width: 30,
                    height: 30,
                    speed: 7.0,
                    health: 100,
                    maxHealth: 100,
                    isDashing: false,
                    dashCooldown: 0,
                    dashDuration: 0,
                    dashSpeed: 18,
                    dashMaxCooldown: 1800,
                    dashMaxDuration: 200,
                    regenAmount: 2,
                    regenInterval: 5000
                };
                this.setDifficulty(this.difficulty);
                
                this.obstacles = [];
                this.obstacleTimestamps = [];
                this.score = 0;
                this.estimatedScore = 1000;
                this.gameTime = 0;
                this.isRunning = false;
                this.isPaused = false;
                this.gameStartTime = 0;
                this.totalPausedTime = 0;
                this.pauseStartTime = 0;
                this.finalSurvivalTime = 0;
                this.healthRegenTimer = 0;

                this.audio = null;
                this.audioStartTime = 0;
                this.audioDuration = 0;
                this.volume = 70;
                
                this.currentScreen = 'menu';
                this.showCacheModal = false;
                this.cachedSongsList = [];
                this.keys = {};
                this.mousePos = { x: 0, y: 0 };
                this.interactiveElements = {};
                this.isSliderDragging = false;
                this.pendingAudio = null;
                this.pendingObstacles = null;
                this.statusMessage = '';
                this.isAnalyzing = false;
                
                this.setupInput();
                this.setupMobileControls();
                this.refreshCacheList();
            }

            async refreshCacheList() {
                try {
                    this.cachedSongsList = await this.idbCache.getAllSongs();
                } catch (e) {
                    console.warn('IndexedDB not accessible:', e);
                    this.cachedSongsList = [];
                }
            }

            isMobileDevice() {
                return window.innerWidth <= 1024 && ('ontouchstart' in window || navigator.maxTouchPoints > 0);
            }

            resizeCanvas() {
                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;
                const dpr = window.devicePixelRatio || 1;
                
                this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                this.canvas.width = viewportWidth * dpr;
                this.canvas.height = viewportHeight * dpr;
                this.ctx.scale(dpr, dpr);
                
                this.width = viewportWidth;
                this.height = viewportHeight;
            }

            getGameArea() {
                const isMobile = this.isMobileDevice();
                const margin = isMobile ? 20 : 30;
                return {
                    x: margin,
                    y: margin + 30,
                    width: this.width - (margin * 2),
                    height: this.height - (margin * 2) - (isMobile ? 60 : 0) - 30
                };
            }

            setDifficulty(difficulty) {
                this.difficulty = difficulty;
                this.difficultyConfig = DIFFICULTY_CONFIGS[difficulty];
                if (this.player) {
                    this.player.speed = this.difficultyConfig.playerSpeed;
                    this.player.maxHealth = this.difficultyConfig.baseHealth;
                    this.player.health = this.difficultyConfig.baseHealth;
                    this.player.regenInterval = this.difficultyConfig.regenInterval;
                    this.player.regenAmount = this.difficultyConfig.regenAmount;
                }
            }

            setupInput() {
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'Tab') { e.preventDefault(); return; }
                    this.keys[e.key] = true;
                    if (e.key === ' ' || e.key === 'Escape') {
                        e.preventDefault();
                        if (this.showCacheModal) {
                            this.showCacheModal = false;
                        } else if (this.currentScreen === 'game' || this.currentScreen === 'pause') {
                            this.togglePause();
                        }
                    }
                    if ((e.key === 'Shift' || e.shiftKey) && this.currentScreen === 'game' && !this.isPaused) {
                        e.preventDefault();
                        this.activateDash();
                    }
                });
                
                window.addEventListener('keyup', (e) => {
                    if (e.key === 'Tab') return;
                    this.keys[e.key] = false;
                });

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden && this.currentScreen === 'game' && !this.isPaused) {
                        this.togglePause();
                    }
                });

                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.mousePos.x = e.clientX - rect.left;
                    this.mousePos.y = e.clientY - rect.top;
                    if (this.isSliderDragging) {
                        this.handleSliderDrag(this.mousePos.x, this.mousePos.y);
                    }
                });

                this.canvas.addEventListener('click', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.handleClick(e.clientX - rect.left, e.clientY - rect.top);
                });

                this.canvas.addEventListener('mousedown', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    if (!this.showCacheModal) {
                        if (this.interactiveElements.volumeSlider && this.ui.isPointInRect(x, y, this.interactiveElements.volumeSlider)) {
                            this.isSliderDragging = 'volume';
                            this.handleSliderDrag(x, y);
                        } else if (this.interactiveElements.menuVolumeSlider && this.ui.isPointInRect(x, y, this.interactiveElements.menuVolumeSlider)) {
                            this.isSliderDragging = 'menuVolume';
                            this.handleSliderDrag(x, y);
                        }
                    }
                });

                window.addEventListener('mouseup', () => { this.isSliderDragging = false; });
                
                this.canvas.addEventListener('touchstart', (e) => {
                    if (e.changedTouches.length > 0) {
                        e.preventDefault();
                        const rect = this.canvas.getBoundingClientRect();
                        const touch = e.changedTouches[0];
                        const scaleX = this.width / rect.width;
                        const scaleY = this.height / rect.height;
                        this.handleClick((touch.clientX - rect.left) * scaleX, (touch.clientY - rect.top) * scaleY);
                    }
                }, { passive: false });
            }

            setupMobileControls() {
                const setupButton = (button, key) => {
                    if (!button) return;
                    const startPress = (e) => { e.preventDefault(); this.keys[key] = true; button.classList.add('pressed'); };
                    const endPress = (e) => { e.preventDefault(); this.keys[key] = false; button.classList.remove('pressed'); };
                    button.addEventListener('touchstart', startPress, { passive: false });
                    button.addEventListener('touchend', endPress, { passive: false });
                    button.addEventListener('touchcancel', endPress, { passive: false });
                    button.addEventListener('mousedown', startPress);
                    button.addEventListener('mouseup', endPress);
                };
                
                setupButton(document.getElementById('upBtn'), 'ArrowUp');
                setupButton(document.getElementById('downBtn'), 'ArrowDown');
                setupButton(document.getElementById('leftBtn'), 'ArrowLeft');
                setupButton(document.getElementById('rightBtn'), 'ArrowRight');
                
                const dashBtn = document.getElementById('dashBtn');
                if (dashBtn) {
                    const dashStart = (e) => {
                        e.preventDefault();
                        this.activateDash();
                        dashBtn.classList.add('pressed');
                        setTimeout(() => dashBtn.classList.remove('pressed'), 200);
                    };
                    dashBtn.addEventListener('touchstart', dashStart, { passive: false });
                    dashBtn.addEventListener('mousedown', dashStart);
                }
                
                const pauseBtn = document.getElementById('pauseBtn');
                if (pauseBtn) {
                    const pauseStart = (e) => {
                        e.preventDefault();
                        if (this.showCacheModal) {
                            this.showCacheModal = false;
                        } else if (this.currentScreen === 'game' || this.currentScreen === 'pause') {
                            this.togglePause();
                            pauseBtn.classList.add('pressed');
                            setTimeout(() => pauseBtn.classList.remove('pressed'), 200);
                        }
                    };
                    pauseBtn.addEventListener('touchstart', pauseStart, { passive: false });
                    pauseBtn.addEventListener('click', pauseStart);
                }
            }

            handleSliderDrag(x, y) {
                if ((this.isSliderDragging === 'volume' || this.isSliderDragging === 'menuVolume') && (this.interactiveElements.volumeSlider || this.interactiveElements.menuVolumeSlider)) {
                    const slider = this.interactiveElements.volumeSlider || this.interactiveElements.menuVolumeSlider;
                    const percent = Math.max(0, Math.min(1, (x - slider.x) / slider.width));
                    this.volume = percent * 100;
                    if (this.audio) this.audio.volume = this.volume / 100;
                }
            }

            handleClick(x, y) {
                if (this.isAnalyzing) return;
                for (let key in this.interactiveElements) {
                    if (this.interactiveElements[key] && this.interactiveElements[key].type === 'button') {
                        const rect = this.interactiveElements[key];
                        if (this.ui.isPointInRect(x, y, rect)) {
                            this.interactiveElements[key].callback();
                            return;
                        }
                    }
                }
            }

            activateDash() {
                if (this.player.dashCooldown <= 0 && !this.player.isDashing) {
                    this.player.isDashing = true;
                    this.player.dashDuration = this.player.dashMaxDuration;
                    this.player.dashCooldown = this.player.dashMaxCooldown;
                }
            }

            loadObstacles(timestamps) {
                const filtered = [];
                const step = this.difficultyConfig.spawnStep;
                const allowedDirections = GAME_MODES[this.gameMode].directions;
                
                for (let i = 0; i < timestamps.length; i++) {
                    if (timestamps[i].type === 'laser' || i % step === 0) {
                        const obstacleCopy = { ...timestamps[i] };
                        obstacleCopy.direction = allowedDirections[i % allowedDirections.length];
                        filtered.push(obstacleCopy);
                    }
                }
                
                this.obstacleTimestamps = filtered.sort((a, b) => a.time - b.time);
                const totalPossibleNearMisses = this.obstacleTimestamps.length;
                this.estimatedScore = Math.max(500, Math.round(totalPossibleNearMisses * 35 * this.difficultyConfig.scoreMultiplier));
            }

            start(audio) {
                this.audio = audio;
                this.audioDuration = audio.duration;
                this.audio.volume = this.volume / 100;
                
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.audioAnalyser = this.audioContext.createAnalyser();
                    this.audioAnalyser.fftSize = 256;
                    this.audioAnalyser.smoothingTimeConstant = 0.8;
                    const source = this.audioContext.createMediaElementSource(audio);
                    source.connect(this.audioAnalyser);
                    this.audioAnalyser.connect(this.audioContext.destination);
                } catch (e) {
                    console.warn('Audio analyser setup failed:', e);
                    this.audioAnalyser = null;
                }
                
                this.isRunning = true;
                this.currentScreen = 'game';
                this.gameStartTime = Date.now();
                this.audioStartTime = Date.now();
                this.totalPausedTime = 0;
                this.pauseStartTime = 0;
                this.healthRegenTimer = 0;
                this.audio.play();
                this.updateMobileControlsVisibility();
            }

            startPendingGame() {
                if (this.pendingAudio && this.pendingObstacles) {
                    this.loadObstacles([...this.pendingObstacles]);
                    this.start(this.pendingAudio);
                    this.pendingAudio = null;
                    this.pendingObstacles = null;
                    this.statusMessage = '';
                }
            }

            formatTime(seconds) {
                if (!seconds || isNaN(seconds) || seconds < 0) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return mins + ':' + (secs < 10 ? '0' : '') + secs;
            }

            getScoreSentence() {
                const ratio = this.score / Math.max(1, this.estimatedScore);
                if (ratio >= 2.05) return "[ø̸͔͕͊̾̄͘5̶̢̛͉͎́͑̋́X̸̢͍̦̲͖͑͋͒̀]"; 
                if (ratio >= 2.0)  return "EPIC-GAMER";
                if (ratio >= 1.75) return "ELITE";
                if (ratio >= 1.5)  return "GOD-LIKE";
                if (ratio >= 1.25) return "HOLY";
                if (ratio >= 1.1)  return "WOW";
                if (ratio >= 0.9)  return "PERFECT";
                if (ratio >= 0.75) return "GREAT";
                if (ratio >= 0.55) return "GOOD";
                if (ratio >= 0.35) return "OKAY";
                if (ratio >= 0.18) return "NOT BAD";
                return "MEH";
            }

            togglePause() {
                if (!this.isRunning && this.currentScreen !== 'pause') return;
                this.isPaused = !this.isPaused;
                this.currentScreen = this.isPaused ? 'pause' : 'game';
                this.updateMobileControlsVisibility();
                if (this.isPaused) {
                    this.pauseStartTime = Date.now();
                    if (this.audio) this.audio.pause();
                } else {
                    if (this.pauseStartTime > 0) {
                        this.totalPausedTime += Date.now() - this.pauseStartTime;
                        this.pauseStartTime = 0;
                    }
                    if (this.audio) this.audio.play();
                }
            }

            spawnObstacle(timestamp) {
                const config = this.difficultyConfig;
                const gameArea = this.getGameArea();
                
                const direction = timestamp.direction || 'right-to-left';

                const obstacle = {
                    type: timestamp.type,
                    beatTime: timestamp.time,
                    direction: direction,
                    x: 0,
                    y: 0,
                    width: 0,
                    height: 0,
                    speed: (5.5 + Math.random() * 1.5) * config.obstacleSpeedMultiplier,
                    damage: Math.round(15 * config.damageMultiplier),
                    isActive: false,
                    spawnTime: 0,
                    activateTime: timestamp.time,
                    warningDuration: config.warningDuration,
                    nearMissed: false
                };

                const centerX = gameArea.x + (gameArea.width / 2);
                const centerY = gameArea.y + (gameArea.height / 2);

                switch (direction) {
                    case 'right-to-left':
                        obstacle.width = timestamp.type === 'square' ? 40 : (timestamp.type === 'triangle' ? 48 : 12);
                        obstacle.height = timestamp.type === 'laser' ? gameArea.height : (timestamp.type === 'square' ? 40 : 48);
                        obstacle.x = gameArea.x + gameArea.width;
                        obstacle.y = timestamp.type === 'laser' ? gameArea.y : (gameArea.y + 40 + Math.random() * (gameArea.height - 120));
                        if (timestamp.type === 'laser') obstacle.isVertical = Math.random() > 0.4;
                        break;

                    case 'left-to-right':
                        obstacle.width = timestamp.type === 'square' ? 40 : (timestamp.type === 'triangle' ? 48 : 12);
                        obstacle.height = timestamp.type === 'laser' ? gameArea.height : (timestamp.type === 'square' ? 40 : 48);
                        obstacle.x = gameArea.x - obstacle.width;
                        obstacle.y = timestamp.type === 'laser' ? gameArea.y : (gameArea.y + 40 + Math.random() * (gameArea.height - 120));
                        break;

                    case 'top-to-bottom':
                        obstacle.width = timestamp.type === 'laser' ? gameArea.width : (timestamp.type === 'square' ? 40 : 48);
                        obstacle.height = timestamp.type === 'square' ? 40 : (timestamp.type === 'triangle' ? 48 : 12);
                        obstacle.x = timestamp.type === 'laser' ? gameArea.x : (gameArea.x + 40 + Math.random() * (gameArea.width - 120));
                        obstacle.y = gameArea.y - obstacle.height;
                        break;

                    case 'bottom-to-top':
                        obstacle.width = timestamp.type === 'laser' ? gameArea.width : (timestamp.type === 'square' ? 40 : 48);
                        obstacle.height = timestamp.type === 'square' ? 40 : (timestamp.type === 'triangle' ? 48 : 12);
                        obstacle.x = timestamp.type === 'laser' ? gameArea.x : (gameArea.x + 40 + Math.random() * (gameArea.width - 120));
                        obstacle.y = gameArea.y + gameArea.height;
                        break;
                }

                let distanceToTravel = 0;
                if (direction === 'right-to-left') distanceToTravel = (gameArea.x + gameArea.width) - centerX;
                else if (direction === 'left-to-right') distanceToTravel = centerX - gameArea.x;
                else if (direction === 'top-to-bottom') distanceToTravel = centerY - gameArea.y;
                else if (direction === 'bottom-to-top') distanceToTravel = (gameArea.y + gameArea.height) - centerY;

                obstacle.spawnLeadTime = Math.max(config.warningDuration, (distanceToTravel / (obstacle.speed * 60)) * 1000);
                obstacle.spawnTime = timestamp.time - obstacle.spawnLeadTime;
                this.obstacles.push(obstacle);
            }

            update() {
                if (!this.isRunning || this.isPaused) return;

                if (this.audio) {
                    const actualAudioMs = this.audio.currentTime * 1000;
                    if (Math.abs(this.gameTime - actualAudioMs) > 40) {
                        this.gameTime = actualAudioMs;
                    } else {
                        this.gameTime += 16.66;
                    }
                }
                
                if (this.audio && this.audio.ended) {
                    this.victory();
                    return;
                }
                
                while (this.obstacleTimestamps.length > 0) {
                    const nextBeat = this.obstacleTimestamps[0];
                    const defaultLeadTime = 2500;
                    if (nextBeat.time - defaultLeadTime <= this.gameTime) {
                        this.spawnObstacle(this.obstacleTimestamps.shift());
                    } else {
                        break;
                    }
                }
                
                if (this.player.isDashing) {
                    this.player.dashDuration -= 16;
                    if (this.player.dashDuration <= 0) this.player.isDashing = false;
                }
                if (this.player.dashCooldown > 0) this.player.dashCooldown = Math.max(0, this.player.dashCooldown - 16);
                
                if (this.player.regenInterval > 0 && this.player.health < this.player.maxHealth) {
                    this.healthRegenTimer += 16;
                    if (this.healthRegenTimer >= this.player.regenInterval) {
                        this.player.health = Math.min(this.player.maxHealth, this.player.health + this.player.regenAmount);
                        this.healthRegenTimer = 0;
                    }
                }
                
                const currentSpeed = this.player.isDashing ? this.player.dashSpeed : this.player.speed;
                const gameArea = this.getGameArea();
                
                if (this.keys['ArrowUp'] || this.keys['w'] || this.keys['W']) {
                    this.player.y = Math.max(gameArea.y, this.player.y - currentSpeed);
                }
                if (this.keys['ArrowDown'] || this.keys['s'] || this.keys['S']) {
                    this.player.y = Math.min(gameArea.y + gameArea.height - this.player.height, this.player.y + currentSpeed);
                }
                if (this.keys['ArrowLeft'] || this.keys['a'] || this.keys['A']) {
                    this.player.x = Math.max(gameArea.x, this.player.x - currentSpeed);
                }
                if (this.keys['ArrowRight'] || this.keys['d'] || this.keys['D']) {
                    this.player.x = Math.min(gameArea.x + gameArea.width - this.player.width, this.player.x + currentSpeed);
                }
                
                for (let i = this.obstacles.length - 1; i >= 0; i--) {
                    const obs = this.obstacles[i];
                    
                    if (this.gameTime >= obs.spawnTime) {
                        obs.isActive = true;
                    }
                    
                    if (obs.isActive) {
                        if (obs.direction === 'right-to-left') obs.x -= obs.speed;
                        else if (obs.direction === 'left-to-right') obs.x += obs.speed;
                        else if (obs.direction === 'top-to-bottom') obs.y += obs.speed;
                        else if (obs.direction === 'bottom-to-top') obs.y -= obs.speed;

                        if (obs.type === 'triangle') {
                            obs.curveAmount = (obs.curveAmount || 0) + 0.05;
                            if (obs.direction === 'right-to-left' || obs.direction === 'left-to-right') {
                                obs.y += Math.sin(obs.curveAmount) * 2.5;
                            } else {
                                obs.x += Math.cos(obs.curveAmount) * 2.5;
                            }
                        }
                    }
                    
                    let shouldRemove = false;
                    if (obs.direction === 'right-to-left' && obs.x + obs.width < gameArea.x - 50) shouldRemove = true;
                    if (obs.direction === 'left-to-right' && obs.x > gameArea.x + gameArea.width + 50) shouldRemove = true;
                    if (obs.direction === 'top-to-bottom' && obs.y > gameArea.y + gameArea.height + 50) shouldRemove = true;
                    if (obs.direction === 'bottom-to-top' && obs.y + obs.height < gameArea.y - 50) shouldRemove = true;
                    if (obs.type === 'laser' && (this.gameTime - obs.activateTime > 1800)) shouldRemove = true;

                    if (shouldRemove) {
                        this.obstacles.splice(i, 1);
                        continue;
                    }
                    
                    if (obs.isActive && this.checkCollision(this.player, obs)) {
                        this.player.health = Math.max(0, this.player.health - obs.damage);
                        this.obstacles.splice(i, 1);
                        if (this.player.health <= 0) this.gameOver();
                        continue;
                    }
                    
                    if (obs.isActive && !obs.nearMissed) {
                        const distance = this.getClosestDistance(this.player, obs);
                        const nearMissThreshold = 45; 
                        if (distance > 0 && distance < nearMissThreshold) {
                            obs.nearMissed = true;
                            const bonusPoints = Math.round((Math.round(25 * (1 - (distance / nearMissThreshold))) + 5) * this.difficultyConfig.scoreMultiplier);
                            this.score += bonusPoints;
                        }
                    }
                }
            }

            checkCollision(player, obstacle) {
                return player.x < obstacle.x + obstacle.width &&
                       player.x + player.width > obstacle.x &&
                       player.y < obstacle.y + obstacle.height &&
                       player.y + player.height > obstacle.y;
            }

            getClosestDistance(player, obstacle) {
                const pCenterX = player.x + player.width / 2;
                const pCenterY = player.y + player.height / 2;
                const closestX = Math.max(obstacle.x, Math.min(pCenterX, obstacle.x + obstacle.width));
                const closestY = Math.max(obstacle.y, Math.min(pCenterY, obstacle.y + obstacle.height));
                const dx = pCenterX - closestX;
                const dy = pCenterY - closestY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            draw() {
                this.ctx.fillStyle = '#0a0a1a';
                this.ctx.fillRect(0, 0, this.width, this.height);
                this.interactiveElements = {};
                this.updateMobileControlsVisibility();
                
                if (this.currentScreen === 'menu') {
                    if (this.showCacheModal) {
                        this.drawMenuScreenWithoutButtons();
                        this.drawCacheModal();
                    } else {
                        this.drawMenuScreen();
                    }
                } else if (this.currentScreen === 'game') {
                    this.drawGameScreen();
                } else if (this.currentScreen === 'pause') {
                    this.drawPauseScreen();
                } else if (this.currentScreen === 'gameover') {
                    this.drawGameOverScreen();
                } else if (this.currentScreen === 'victory') {
                    this.drawVictoryScreen();
                }
            }

            updateMobileControlsVisibility() {
                const mobileControls = document.querySelector('.mobile-controls');
                if (!mobileControls) return;
                if (this.currentScreen === 'game' && !this.isPaused && this.isMobileDevice()) {
                    mobileControls.style.display = 'block';
                    document.body.classList.add('gameplay');
                } else {
                    mobileControls.style.display = 'none';
                    document.body.classList.remove('gameplay');
                }
            }

                    const leftX = centerX - fileBtnWidth - 15;
                    const rightX = centerX + 15;
                    
                    const fileBtn = this.ui.drawButton(leftX, fileBtnY, fileBtnWidth, fileBtnHeight, this.isAnalyzing ? 'Analyzing...' : 'Choose Music File', false, this.isAnalyzing);
                    if (!this.isAnalyzing) {
                        this.interactiveElements.fileBtn = { ...fileBtn, type: 'button', callback: () => this.openFileDialog() };
                    }
                    
                    const startBtn = this.ui.drawButton(rightX, fileBtnY, fileBtnWidth, fileBtnHeight, 'Start Run!', true);
                    this.interactiveElements.startBtn = { ...startBtn, type: 'button', callback: () => this.startPendingGame() };
                } else {
                    const fileBtn = this.ui.drawButton(centerX - fileBtnWidth / 2, fileBtnY, fileBtnWidth, fileBtnHeight, this.isAnalyzing ? 'Analyzing...' : 'Choose Music File', false, this.isAnalyzing);
                    if (!this.isAnalyzing) {
                        this.interactiveElements.fileBtn = { ...fileBtn, type: 'button', callback: () => this.openFileDialog() };
                    }
                }

                const cacheBtnY = fileBtnY + fileBtnHeight + (isMobile ? 15 : 22);
                const cacheBtnWidth = isMobile ? 280 : 340;
                const cacheBtnHeight = isMobile ? 46 : 54;
                const cacheBtn = this.ui.drawButton(centerX - cacheBtnWidth / 2, cacheBtnY, cacheBtnWidth, cacheBtnHeight, `Manage Cache (${this.cachedSongsList.length})`, false, this.cachedSongsList.length === 0);
                if (this.cachedSongsList.length > 0) {
                    this.interactiveElements.manageCacheBtn = {
                        ...cacheBtn,
                        type: 'button',
                        callback: () => { this.showCacheModal = true; }
                    };
                }
                
                const sliderWidth = isMobile ? 360 : 480;
                const sliderHeight = isMobile ? 32 : 38;
                const sliderY = cacheBtnY + cacheBtnHeight + (isMobile ? 25 : 35);
                this.interactiveElements.menuVolumeSlider = this.ui.drawSlider(
                    centerX - sliderWidth / 2, sliderY, sliderWidth, sliderHeight, this.volume, 100, 'Volume:'
                );

                if (this.statusMessage) {
                    this.ctx.fillStyle = '#00ffff';
                    this.ctx.font = 'bold ' + (isMobile ? '15px' : '18px') + ' Arial';
                    this.ctx.textAlign = 'center';
                    const dots = this.isAnalyzing ? '.'.repeat(Math.floor(Date.now() / 300) % 4) : '';
                    this.ctx.fillText(this.statusMessage + dots, centerX, sliderY + sliderHeight + (isMobile ? 25 : 35));
                }
            }

            drawCacheModal() {
                this.interactiveElements = {};

                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                this.ctx.fillRect(0, 0, this.width, this.height);

                const cx = this.width / 2;
                const cy = this.height / 2;
                const modalWidth = Math.min(640, this.width - 40);
                const modalHeight = Math.min(500, this.height - 40);
                const modalX = cx - modalWidth / 2;
                const modalY = cy - modalHeight / 2;

                this.ctx.fillStyle = 'rgba(26, 26, 46, 0.98)';
                this.ctx.fillRect(modalX, modalY, modalWidth, modalHeight);
                this.ctx.strokeStyle = '#00ffff';
                this.ctx.lineWidth = 3;
                this.ctx.strokeRect(modalX, modalY, modalWidth, modalHeight);

                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = 'bold 26px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText('Cached Songs', cx, modalY + 38);

                let listY = modalY + 80;
                const itemHeight = 48;
                const maxVisible = 6;

                for (let i = 0; i < Math.min(maxVisible, this.cachedSongsList.length); i++) {
                    const song = this.cachedSongsList[i];
                    const displayName = song.title.length > 22 ? song.title.substring(0, 19) + '...' : song.title;

                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                    this.ctx.fillRect(modalX + 25, listY, modalWidth - 50, itemHeight - 8);

                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = '15px Arial';
                    this.ctx.textAlign = 'left';
                    this.ctx.fillText(displayName, modalX + 40, listY + (itemHeight - 8) / 2);

                    const loadBtn = this.ui.drawButton(modalX + modalWidth - 220, listY + 3, 90, 34, 'Load');
                    this.interactiveElements['modal_load_' + i] = {
                        ...loadBtn,
                        type: 'button',
                        callback: () => {
                            try {
                                this.audioFile = song.fileBlob;
                                this.originalObstacles = song.obstacles;
                                this.pendingObstacles = [...song.obstacles];
                                this.pendingAudio = new Audio(URL.createObjectURL(song.fileBlob));
                                this.statusMessage = `Ready: "${song.title}" (${song.obstacles.length} hazards loaded!)`;
                                this.showCacheModal = false;
                            } catch (err) {
                                console.error('Failed to load song from IndexedDB', err);
                            }
                        }
                    };

                    const removeBtn = this.ui.drawButton(modalX + modalWidth - 120, listY + 3, 90, 34, 'Remove');
                    this.interactiveElements['modal_del_' + i] = {
                        ...removeBtn,
                        type: 'button',
                        callback: async () => {
                            await this.idbCache.removeSong(song.id);
                            await this.refreshCacheList();
                        }
                    };

                    listY += itemHeight;
                }

                if (this.cachedSongsList.length === 0) {
                    this.ctx.fillStyle = '#aaa';
                    this.ctx.font = '18px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('No cached songs found.', cx, modalY + modalHeight / 2 - 20);
                }

                const clearAllBtn = this.ui.drawButton(modalX + 30, modalY + modalHeight - 65, 190, 44, 'Clear All Cache', false, this.cachedSongsList.length === 0);
                if (this.cachedSongsList.length > 0) {
                    this.interactiveElements.modalClearAll = {
                        ...clearAllBtn,
                        type: 'button',
                        callback: async () => {
                            await this.idbCache.clearAll();
                            await this.refreshCacheList();
                        }
                    };
                }

                const closeBtn = this.ui.drawButton(modalX + modalWidth - 220, modalY + modalHeight - 65, 190, 44, 'Close', true);
                this.interactiveElements.modalClose = {
                    ...closeBtn,
                    type: 'button',
                    callback: () => {
                        this.showCacheModal = false;
                    }
                };
            }

            drawGameScreen() {
                this.drawDynamicBackground();
                this.drawGrid();
                this.drawObstacles();
                this.drawPlayer();
                this.drawGameHUD();
            }

            drawGrid() {
                this.ctx.strokeStyle = 'rgba(0, 255, 255, 0.08)';
                this.ctx.lineWidth = 1;
                const gameArea = this.getGameArea();
                const gridSize = 50;
                for (let x = gameArea.x; x < gameArea.x + gameArea.width; x += gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, gameArea.y);
                    this.ctx.lineTo(x, gameArea.y + gameArea.height);
                    this.ctx.stroke();
                }
                for (let y = gameArea.y; y < gameArea.y + gameArea.height; y += gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(gameArea.x, y);
                    this.ctx.lineTo(gameArea.x + gameArea.width, y);
                    this.ctx.stroke();
                }
            }

            drawObstacles() {
                this.obstacles.forEach(obs => {
                    const isWarning = this.gameTime < obs.activateTime;
                    const warningProgress = Math.max(0, Math.min(1, (this.gameTime - obs.spawnTime) / (obs.activateTime - obs.spawnTime)));
                    const alpha = isWarning ? (0.2 + warningProgress * 0.4) : 1.0;
                    
                    this.ctx.save();
                    this.ctx.globalAlpha = alpha;
                    
                    if (obs.type === 'laser') {
                        this.ctx.fillStyle = isWarning ? '#ffaa00' : '#ff0000';
                        if (!isWarning) {
                            this.ctx.shadowBlur = 25;
                            this.ctx.shadowColor = '#ff0000';
                        }
                        this.ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    } else if (obs.type === 'square') {
                        this.ctx.fillStyle = isWarning ? '#666666' : '#00ffff';
                        this.ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                        if (!isWarning) {
                            this.ctx.shadowBlur = 15;
                            this.ctx.shadowColor = '#00ffff';
                            this.ctx.strokeStyle = '#ffffff';
                            this.ctx.lineWidth = 3;
                            this.ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                        }
                    } else if (obs.type === 'triangle') {
                        this.ctx.fillStyle = isWarning ? '#666666' : '#ff00ff';
                        this.ctx.beginPath();
                        this.ctx.moveTo(obs.x + obs.width / 2, obs.y);
                        this.ctx.lineTo(obs.x, obs.y + obs.height);
                        this.ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                        this.ctx.closePath();
                        this.ctx.fill();
                        if (!isWarning) {
                            this.ctx.shadowBlur = 15;
                            this.ctx.shadowColor = '#ff00ff';
                            this.ctx.strokeStyle = '#ffffff';
                            this.ctx.lineWidth = 3;
                            this.ctx.stroke();
                        }
                    }
                    this.ctx.restore();
                });
            }

            drawDynamicBackground() {
                if (!this.audio || !this.audioAnalyser) return;
                const bufferLength = this.audioAnalyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                this.audioAnalyser.getByteFrequencyData(dataArray);
                
                let sum = 0;
                for (let i = 0; i < Math.min(32, bufferLength); i++) sum += dataArray[i];
                const intensity = (sum / Math.min(32, bufferLength)) / 255;
                
                const hue1 = (Date.now() * 0.02 + intensity * 180) % 360;
                const hue2 = (hue1 + 60) % 360;
                const gradient = this.ctx.createLinearGradient(0, 0, this.width, this.height);
                gradient.addColorStop(0, `hsla(${hue1}, 70%, 15%, 0.3)`);
                gradient.addColorStop(1, `hsla(${hue2}, 80%, 10%, 0.2)`);
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.width, this.height);
            }

            drawPlayer() {
                this.ctx.save();
                if (this.player.isDashing) {
                    this.ctx.fillStyle = '#ffff00';
                    this.ctx.shadowBlur = 40;
                    this.ctx.shadowColor = '#ffff00';
                    for (let i = 1; i <= 3; i++) {
                        this.ctx.globalAlpha = 0.3 / i;
                        this.ctx.fillRect(this.player.x - (i * 10), this.player.y, this.player.width, this.player.height);
                    }
                } else {
                    this.ctx.fillStyle = '#00ff00';
                    this.ctx.shadowBlur = 20;
                    this.ctx.shadowColor = '#00ff00';
                }
                this.ctx.fillRect(this.player.x, this.player.y, this.player.width, this.player.height);
                this.ctx.strokeStyle = '#ffffff';
                this.ctx.lineWidth = 3;
                this.ctx.strokeRect(this.player.x, this.player.y, this.player.width, this.player.height);
                this.ctx.restore();
            }

            drawGameHUD() {
                const padding = 20;
                this.ctx.save();
                
                if (this.audio && this.audioDuration > 0) {
                    const barWidth = Math.min(400, this.width * 0.5);
                    const barHeight = 20;
                    const barX = (this.width - barWidth) / 2;
                    const barY = padding;
                    
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                    this.ctx.fillRect(barX, barY, barWidth, barHeight);
                    
                    const progress = (this.audio.currentTime || 0) / this.audioDuration;
                    this.ctx.fillStyle = '#00ffff';
                    this.ctx.fillRect(barX, barY, barWidth * progress, barHeight);
                    
                    this.ctx.strokeStyle = '#ffffff';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(barX, barY, barWidth, barHeight);
                    
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = 'bold 12px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillText(`${this.formatTime(this.audio.currentTime)} / ${this.formatTime(this.audioDuration)}`, barX + barWidth / 2, barY + barHeight / 2);
                }
                
                const healthWidth = 200;
                const healthHeight = 25;
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                this.ctx.fillRect(padding, padding, healthWidth, healthHeight);
                
                const curHealthWidth = (this.player.health / this.player.maxHealth) * healthWidth;
                this.ctx.fillStyle = this.player.health > 50 ? '#00ff00' : (this.player.health > 25 ? '#ffff00' : '#ff0000');
                this.ctx.fillRect(padding, padding, curHealthWidth, healthHeight);
                this.ctx.strokeStyle = '#ffffff';
                this.ctx.lineWidth = 2;
                this.ctx.strokeRect(padding, padding, healthWidth, healthHeight);
                
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = 'bold 14px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText(`${Math.round(this.player.health)} HP`, padding + healthWidth / 2, padding + healthHeight / 2);
                
                this.ctx.font = 'bold 18px Arial';
                this.ctx.textAlign = 'right';
                this.ctx.fillStyle = '#00ffff';
                this.ctx.fillText('Score: ' + this.score, this.width - padding, padding + 20);
                
                this.ctx.restore();
            }

            drawPauseScreen() {
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                this.ctx.fillRect(0, 0, this.width, this.height);
                
                const cx = this.width / 2;
                const cy = this.height / 2;
                const panelWidth = 500;
                const panelHeight = 350;
                const panelX = cx - panelWidth / 2;
                const panelY = cy - panelHeight / 2;
                
                this.ctx.fillStyle = 'rgba(26, 26, 46, 0.95)';
                this.ctx.fillRect(panelX, panelY, panelWidth, panelHeight);
                this.ctx.strokeStyle = '#00ffff';
                this.ctx.lineWidth = 3;
                this.ctx.strokeRect(panelX, panelY, panelWidth, panelHeight);
                
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = 'bold 32px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText('PAUSED', cx, panelY + 50);
                
                this.interactiveElements.volumeSlider = this.ui.drawSlider(
                    panelX + 40, panelY + 130, panelWidth - 80, 30, this.volume, 100, 'Volume:'
                );
                
                const resumeBtn = this.ui.drawButton(cx - 120, panelY + 200, 240, 45, 'Resume', false);
                this.interactiveElements.resumeBtn = { ...resumeBtn, type: 'button', callback: () => this.togglePause() };
                
                const menuBtn = this.ui.drawButton(cx - 120, panelY + 260, 240, 45, 'Return to Menu', false);
                this.interactiveElements.menuBtn = { ...menuBtn, type: 'button', callback: () => this.returnToMenu() };
            }

            drawGameOverScreen() {
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                this.ctx.fillRect(0, 0, this.width, this.height);
                const cx = this.width / 2, cy = this.height / 2;
                
                this.ctx.fillStyle = '#ff0000';
                this.ctx.font = 'bold 36px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('GAME OVER', cx, cy - 100);
                
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = '20px Arial';
                this.ctx.fillText('Final Score: ' + this.score, cx, cy - 40);
                this.ctx.fillText('Rating: ' + this.getScoreSentence(), cx, cy - 10);
                this.ctx.fillText('Survival Time: ' + this.formatTime(this.finalSurvivalTime), cx, cy + 20);
                
                const tryBtn = this.ui.drawButton(cx - 120, cy + 70, 240, 45, 'Try Again', false);
                this.interactiveElements.tryBtn = { ...tryBtn, type: 'button', callback: () => this.restartGame() };
                
                const menuBtn = this.ui.drawButton(cx - 120, cy + 130, 240, 45, 'Choose New Song', false);
                this.interactiveElements.menuBtn2 = { ...menuBtn, type: 'button', callback: () => this.returnToMenu() };
            }

            drawVictoryScreen() {
                this.ctx.fillStyle = 'rgba(0, 50, 0, 0.85)';
                this.ctx.fillRect(0, 0, this.width, this.height);
                const cx = this.width / 2, cy = this.height / 2;
                
                this.ctx.fillStyle = '#00ff00';
                this.ctx.font = 'bold 36px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('VICTORY!', cx, cy - 100);
                
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = '20px Arial';
                this.ctx.fillText('Final Score: ' + this.score, cx, cy - 40);
                this.ctx.fillText('Rating: ' + this.getScoreSentence(), cx, cy - 10);
                
                const againBtn = this.ui.drawButton(cx - 120, cy + 70, 240, 45, 'Play Again', false);
                this.interactiveElements.againBtn = { ...againBtn, type: 'button', callback: () => this.restartGame() };
                
                const menuBtn = this.ui.drawButton(cx - 120, cy + 130, 240, 45, 'Choose New Song', false);
                this.interactiveElements.menuBtn3 = { ...menuBtn, type: 'button', callback: () => this.returnToMenu() };
            }

            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }

            gameOver() {
                this.isRunning = false;
                this.currentScreen = 'gameover';
                if (this.audio) this.audio.pause();
                this.finalSurvivalTime = (this.audio ? this.audio.currentTime : 0);
                this.updateMobileControlsVisibility();
            }

            victory() {
                this.isRunning = false;
                this.currentScreen = 'victory';
                if (this.audio) this.audio.pause();
                this.finalSurvivalTime = (this.audio ? this.audio.currentTime : 0);
                this.updateMobileControlsVisibility();
            }

            reset() {
                const gameArea = this.getGameArea();
                this.player.x = gameArea.x + gameArea.height / 2;
                this.player.y = gameArea.y + gameArea.height / 2;
                this.player.health = this.player.maxHealth;
                this.player.isDashing = false;
                this.player.dashCooldown = 0;
                this.player.dashDuration = 0;
                this.obstacles = [];
                this.score = 0;
                this.gameTime = 0;
                this.isPaused = false;
                this.totalPausedTime = 0;
                this.pauseStartTime = 0;
                this.keys = {};
            }

            restartGame() {
                this.reset();
                this.loadObstacles([...this.originalObstacles]);
                const audio = new Audio(URL.createObjectURL(this.audioFile));
                this.start(audio);
            }

            returnToMenu() {
                if (this.audio) {
                    this.audio.pause();
                    this.audio = null;
                }
                this.reset();
                this.originalObstacles = null;
                this.obstacleTimestamps = [];
                this.isRunning = false;
                this.currentScreen = 'menu';
                this.showCacheModal = false;
                this.pendingAudio = null;
                this.pendingObstacles = null;
                this.statusMessage = '';
                this.isAnalyzing = false;
                this.updateMobileControlsVisibility();
            }

            openFileDialog() {
                if (this.isAnalyzing) return;
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'audio/*';
                input.onchange = (e) => this.handleFileUpload(e);
                input.click();
            }

            async handleFileUpload(e) {
                const file = e.target.files[0];
                if (!file) return;
                this.audioFile = file;
                const songId = `song_${file.name}_${file.size}`;

                try {
                    const cachedSong = await this.idbCache.getSong(songId);
                    if (cachedSong) {
                        this.statusMessage = `Loaded "${file.name}" from Cache!`;
                        this.originalObstacles = cachedSong.obstacles;
                        this.pendingAudio = new Audio(URL.createObjectURL(cachedSong.fileBlob));
                        this.pendingObstacles = [...cachedSong.obstacles];
                        return;
                    }
                } catch (err) {
                    console.warn('Cache lookup failed, re-analyzing', err);
                }

                this.isAnalyzing = true;
                this.statusMessage = 'Decoding audio file';

                setTimeout(async () => {
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

                        const obstacles = await this.beatDetector.analyzeAudio(audioBuffer, (msg) => {
                            this.statusMessage = msg;
                        });

                        try {
                            await this.idbCache.saveSong(songId, file.name, file, obstacles);
                            await this.refreshCacheList();
                        } catch (storageErr) {
                            console.warn('Failed to save to IndexedDB', storageErr);
                        }

                        this.statusMessage = `Analyzed & Cached "${file.name}" (${obstacles.length} hazards)!`;
                        this.originalObstacles = obstacles;
                        this.pendingAudio = new Audio(URL.createObjectURL(file));
                        this.pendingObstacles = [...obstacles];
                    } catch (error) {
                        this.statusMessage = 'Error: ' + error.message;
                        console.error('Error processing audio:', error);
                    } finally {
                        this.isAnalyzing = false;
                    }
                }, 50);
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const game = new RhythmRunner(canvas);
        game.gameLoop();
    </script>
</body>
</html>
